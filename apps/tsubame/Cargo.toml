[package]
name = "tsubame-stream"
version = "0.19.0"
edition = "2021"

[dependencies]
stream-core = { path = "../../crates/stream-core" }
stream-capture = { path = "../../crates/stream-capture" }
stream-audio = { path = "../../crates/stream-audio" }
stream-recording = { path = "../../crates/stream-recording" }
